<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Custom Object Extractor</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card">
      <h1>Custom Object Extractor</h1>
      <p class="lead">
        Enter your API key and object key to continue. Keep your keys
        safe&mdash;they stay in your browser.
      </p>
      <form id="credentials-form" autocomplete="off">
        <div class="field">
          <label for="apiKey">API Key</label>
          <input
            id="apiKey"
            name="apiKey"
            type="password"
            placeholder="sk-..."
            required
          />
        </div>
        <div class="field">
          <label for="objectKey">Object Key</label>
          <input
            id="objectKey"
            name="objectKey"
            type="text"
            placeholder="utm_touch"
            spellcheck="false"
            required
          />
          <div id="object-hint" class="field-hint" aria-live="polite"></div>
        </div>
        <div class="form-actions">
          <button type="submit" id="fetch-button">Continue</button>
          <button type="button" id="cancel-fetch" class="secondary" hidden>
            Cancel
          </button>
        </div>
        <div id="status" class="status" role="status" aria-live="polite"></div>
        <div id="loader" class="loader">
          <span class="spinner"></span>
          <span class="loader-text">Fetching records…</span>
        </div>
      </form>
      <div id="schema-badge" class="schema-badge" hidden></div>
      <div id="filter-bar" class="filters">
        <div class="filter-field">
          <label for="filter-field">Field</label>
          <select id="filter-field-select"></select>
        </div>
        <div class="filter-value">
          <label for="filter-value-toggle">Value</label>
          <div class="multiselect" id="filter-value-multi">
            <button
              type="button"
              id="filter-value-toggle"
              class="multiselect-toggle"
              aria-expanded="false"
              aria-haspopup="true"
            >
              <span class="multiselect-summary" id="filter-value-summary">All</span>
              <span class="multiselect-caret" aria-hidden="true"></span>
            </button>
            <div class="multiselect-popover" id="filter-value-popover" hidden>
              <div class="multiselect-toolbar">
                <input
                  type="search"
                  id="filter-value-search"
                  placeholder="Search values…"
                  aria-label="Search filter values"
                  autocomplete="off"
                />
              </div>
              <div class="multiselect-toolbar actions">
                <button type="button" id="filter-value-all">Select all</button>
                <button type="button" id="filter-value-none">Clear</button>
              </div>
              <div
                class="multiselect-options"
                id="filter-value-options"
                role="group"
                aria-label="Filter values"
              ></div>
              <p class="multiselect-empty" id="filter-value-empty" hidden>
                No matching values
              </p>
            </div>
          </div>
        </div>
        <div class="filter-range" id="filter-range">
          <label>Date Range (UTC)</label>
          <div class="range-inputs">
            <input type="datetime-local" id="filter-date-from" />
            <span class="range-sep">to</span>
            <input type="datetime-local" id="filter-date-to" />
          </div>
        </div>
        <div class="filter-actions">
          <button type="button" id="reset-filter" class="secondary">
            Reset
          </button>
          <button type="button" id="download-images" class="secondary">
            Download Files
          </button>
          <button type="button" id="download-csv" class="secondary">
            Download CSV
          </button>
          <button type="button" id="import-contact-list" class="secondary">
            Import filtered record as contact list
          </button>
        </div>
        <div class="multiselect-chips" id="filter-value-chips" hidden></div>
        <div id="url-feature" class="url-feature" style="display: none">
          <div class="filter-field">
            <label for="url-column-select">URL column</label>
            <select id="url-column-select"></select>
          </div>
          <div id="image-count-note" class="image-note"></div>
          <div id="image-download-progress" class="image-progress" hidden>
            <div class="progress-bar">
              <div id="progress-fill" class="progress-fill"></div>
            </div>
            <div id="progress-text" class="progress-text"></div>
          </div>
        </div>
      </div>
      <div id="pagination" class="pagination">
        <div class="page-controls">
          <button type="button" id="prev-page" class="secondary">
            &larr; Prev
          </button>
          <button type="button" id="next-page" class="secondary">
            Next &rarr;
          </button>
        </div>
        <div class="page-size">
          <label for="page-size">Rows per page</label>
          <select id="page-size">
            <option value="50">50</option>
            <option value="100" selected>100</option>
            <option value="200">200</option>
            <option value="500">500</option>
          </select>
        </div>
        <div class="page-info" id="page-info">Showing 0 of 0</div>
      </div>
      <div id="results" class="table-wrap">
        <table>
          <thead id="table-head"></thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </main>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"
      integrity="sha512-XMVd28F1oH/O71fzwBnV7HucLxVwtxf26XV8P4wPk26EDxuGZ91N8bsOttmnomcCD3CS5ZMRL50H0GgOHvegtg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
